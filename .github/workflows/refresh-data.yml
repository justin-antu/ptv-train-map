name: Refresh live Metro Trains Melbourne data

# Rebuilds public/data/network-live.json for the static GitHub Pages
# deployment: the shipped GTFS timetable as the spine, with GTFS-Realtime trip
# updates and vehicle positions layered over it.
#
# This used to run three sub-fetches ~80 seconds apart, because a single fetch
# polled PTV once per (line, station) pair and took minutes to complete. Three
# requests now cover the whole network in seconds, so a single fetch per run is
# both fresher and simpler.
#
# GITHUB_TOKEN-authored pushes do not trigger downstream push workflows.
# Explicit dispatch is therefore required to start deploy.yml after a change.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch live data and commit the snapshot
        id: fetch
        env:
          VIC_GTFS_R_KEY: ${{ secrets.VIC_GTFS_R_KEY }}
          PTV_DEV_ID: ${{ secrets.PTV_DEV_ID }}
          PTV_API_KEY: ${{ secrets.PTV_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${VIC_GTFS_R_KEY:-}" ]; then
            echo "::warning::VIC_GTFS_R_KEY is not set — the snapshot will carry timetable times with no real-time layer. Register at https://opendata.transport.vic.gov.au and add the secret."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npx tsx scripts/fetch-live-data.ts

          if git diff --quiet -- public/data/network-live.json; then
            echo "No change in live data snapshot; skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add public/data/network-live.json
          git commit -m "chore(data): refresh live Metro Trains Melbourne departures ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          bash scripts/push-generated-data.sh
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger a Pages deploy for the new data
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
