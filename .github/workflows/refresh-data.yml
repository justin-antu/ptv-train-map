name: Refresh live Metro Trains Melbourne data

# Runs on a schedule to fetch live/predicted departures — across all 16
# in-scope Metro lines (see scripts/lib/lines.ts; V/Line excluded) — from the
# PTV Timetable API and commit the resulting snapshot
# (public/data/network-live.json) so the statically-hosted GitHub Pages site
# can pick it up.
#
# Within a single run we loop the fetch a few times, ~80s apart, and commit
# after each one. This gives noticeably fresher data than the 5-minute cron
# cadence alone would (GitHub Actions schedules don't reliably fire more often
# than every 5 minutes), without spamming the Actions scheduler. Each fetch
# covers ~300 (line, station) pairs but uses bounded concurrency (see
# scripts/lib/concurrency.ts), so a full fetch takes well under a minute.
#
# IMPORTANT: commits pushed here are authored using this workflow's own
# automatic GITHUB_TOKEN, and GitHub explicitly prevents GITHUB_TOKEN-authored
# pushes from triggering *other* `on: push` workflows (loop prevention) — so
# deploy.yml's `on: push` listener never fires for these commits on its own.
# The final step below works around that by explicitly dispatching deploy.yml
# via `workflow_dispatch`, which is *not* subject to that restriction.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  SUBFETCH_COUNT: 3
  SUBFETCH_INTERVAL_SECONDS: 80

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch live data a few times and commit each snapshot
        id: fetch
        env:
          PTV_DEV_ID: ${{ secrets.PTV_DEV_ID }}
          PTV_API_KEY: ${{ secrets.PTV_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${PTV_DEV_ID:-}" ] || [ -z "${PTV_API_KEY:-}" ]; then
            echo "::warning::PTV_DEV_ID / PTV_API_KEY secrets are not set yet — skipping live data fetch. The site will keep showing demo/sample data until these are configured (see README)."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          changed=false

          for i in $(seq 1 "${SUBFETCH_COUNT}"); do
            echo "--- Fetch attempt ${i}/${SUBFETCH_COUNT} ---"
            if npx tsx scripts/fetch-live-data.ts; then
              if ! git diff --quiet -- public/data/network-live.json; then
                git add public/data/network-live.json
                git commit -m "chore(data): refresh live Metro Trains Melbourne departures ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
                git pull --rebase --autostash
                git push
                changed=true
              else
                echo "No change in live data snapshot; skipping commit."
              fi
            else
              echo "::warning::Live data fetch attempt ${i} failed; will retry on next attempt/run."
            fi

            if [ "${i}" -lt "${SUBFETCH_COUNT}" ]; then
              sleep "${SUBFETCH_INTERVAL_SECONDS}"
            fi
          done

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Trigger a Pages deploy for the new data
        # Only needed if at least one commit was actually pushed above, and
        # only once per job run regardless of how many of the sub-fetches
        # produced a new commit — deploying just deploys whatever is
        # currently at the tip of main, so only the final state matters.
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
