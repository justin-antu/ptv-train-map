<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Your next Metro Trains Melbourne service. Home to work, platform and all."
    />
    <title>Dude, where's my train? — Melbourne train departures</title>
    <meta property="og:title" content="Dude, where's my train?" />
    <meta property="og:description" content="Your next Metro Trains Melbourne service. Home to work, platform and all." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#f4f1ea" />
    <script>
      (() => {
        let theme = "light";
        try {
          const stored = localStorage.getItem("wimt:theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch {
          // Storage disabled/inaccessible — use the default theme.
        }

        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#07080c" : "#f4f1ea");
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Not "black-translucent": that draws the web view under the status bar and
      Dynamic Island, and the sticky header has no top inset to compensate.
      "default" makes iOS reserve the strip and tint it from theme-color.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Where's my train?" />
    <link rel="canonical" href="https://justin-antu.github.io/ptv-train-map/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
